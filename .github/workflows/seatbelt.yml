name: seatbelt

# Runs the `:seatbelt` tests, which start commands under the verification dev server's real
# `sandbox-exec` profile: a read of a credential path fails, a connection off loopback fails, the
# egress proxy tunnels only to allowlisted hosts, and a dev server serves from inside the sandbox.
# `test/test_helper.exs` excludes them where `sandbox-exec` can't run, which is `make-all`'s
# Ubuntu runners and every agent run (Seatbelt can't nest), so they run here, on a macOS runner.
# `--only seatbelt` runs them even so, and fails when none is found.
#
# Not a required check: on a pull request that changes none of these paths the workflow doesn't
# run. Pushes to `main` that change them run it too, so it stays green there.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/symphony_elixir/verification/**"
      - "lib/symphony_elixir/agent_sandbox_config.ex"
      - "scripts/qa-dashboard-server.sh"
      - "test/symphony_elixir/verification/dev_server_sandbox_test.exs"
      - "test/symphony_elixir/verification_test.exs"
      - "test/test_helper.exs"
      - ".github/workflows/seatbelt.yml"
  push:
    branches:
      - main
    paths:
      - "lib/symphony_elixir/verification/**"
      - "lib/symphony_elixir/agent_sandbox_config.ex"
      - "scripts/qa-dashboard-server.sh"
      - "test/symphony_elixir/verification/dev_server_sandbox_test.exs"
      - "test/symphony_elixir/verification_test.exs"
      - "test/test_helper.exs"
      - ".github/workflows/seatbelt.yml"

permissions:
  contents: read

concurrency:
  group: seatbelt-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seatbelt:
    name: seatbelt tests
    runs-on: macos-15
    # One test builds this checkout with `scripts/qa-dashboard-server.sh` before it serves.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-seatbelt-mix-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-seatbelt-mix-

      - name: Show toolchain
        run: |
          sw_vers
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true && echo "sandbox-exec works"

      - name: Install dependencies
        run: time mix deps.get

      - name: Diagnose (temporary)
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/ws" "$RUNNER_TEMP/tmp"
          WS=$(cd "$RUNNER_TEMP/ws" && pwd -P); TMPD=$(cd "$RUNNER_TEMP/tmp" && pwd -P)
          MIX_ENV=test mix compile > /dev/null 2>&1
          MIX_ENV=test mix run --no-start -e "IO.write(SymphonyElixir.Verification.DevServerSandbox.profile(\"$WS\", [\"$WS\", \"$TMPD\"], []))" > "$RUNNER_TEMP/profile.sb"
          echo "== profile"; cat "$RUNNER_TEMP/profile.sb"
          SB() { /usr/bin/sandbox-exec -f "$RUNNER_TEMP/profile.sb" /bin/sh -lc "$1" 2>&1; echo "[exit $?]"; }
          echo "== login shell"; ls -la ~/.profile ~/.bash_profile /etc/profile; cat /etc/profile
          echo "== host python3: $(command -v python3) $(python3 -V)"
          SB 'echo PATH=$PATH; command -v python3; python3 -V; ls -la "$(command -v python3)"'
          IP=$(ipconfig getifaddr en0 || ipconfig getifaddr en1)
          echo "== en0 ip: $IP"
          for addr in 0.0.0.0 127.0.0.1 "$IP"; do
            for port in 0 18765; do
              echo "-- bind $addr:$port"
              SB "python3 -c 'import socket; s=socket.socket(); s.bind((\"$addr\", $port)); s.listen(); print(\"bound\", s.getsockname())'"
            done
          done
          echo "-- minimal profile bind 0.0.0.0"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)(allow network-bind (local ip "localhost:*"))' python3 -c 'import socket; s=socket.socket(); s.bind(("0.0.0.0", 0)); s.listen(); print("bound", s.getsockname())' 2>&1; echo "[exit $?]"
          echo "-- minimal profile bind 0.0.0.0 with ip4"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)(deny network*)(allow network-bind (local ip4 "localhost:*"))' python3 -c 'import socket; s=socket.socket(); s.bind(("0.0.0.0", 0)); s.listen(); print("bound", s.getsockname())' 2>&1; echo "[exit $?]"
          echo "-- bind 0.0.0.0, then accept from en0 ip"
          /usr/bin/sandbox-exec -f "$RUNNER_TEMP/profile.sb" python3 -c 'import socket; s=socket.socket(); s.bind(("0.0.0.0", 18766)); s.listen(); s.settimeout(8); c,a=s.accept(); print("accepted", a); print("recv", c.recv(10))' > "$RUNNER_TEMP/accept.log" 2>&1 &
          sleep 2; python3 -c "import socket; c=socket.create_connection(('$IP', 18766), timeout=3); c.send(b'hi'); print('client connected')" 2>&1; sleep 2; wait; cat "$RUNNER_TEMP/accept.log"
          echo "== http.server under the profile with sh -lc"
          (cd "$WS" && TMPDIR="$TMPD" /usr/bin/sandbox-exec -f "$RUNNER_TEMP/profile.sb" /bin/sh -lc 'exec python3 -m http.server 18767 --bind 127.0.0.1' > "$RUNNER_TEMP/http.log" 2>&1 &)
          sleep 5; curl -sS -m 3 -o /dev/null -w 'http %{http_code}\n' http://127.0.0.1:18767/; echo "[curl exit $?]"
          pkill -f 'http.server 18767'; sleep 1; echo "-- http.server log"; cat "$RUNNER_TEMP/http.log"
          echo "== same without -l"
          (cd "$WS" && TMPDIR="$TMPD" /usr/bin/sandbox-exec -f "$RUNNER_TEMP/profile.sb" /bin/sh -c 'exec python3 -m http.server 18768 --bind 127.0.0.1' > "$RUNNER_TEMP/http2.log" 2>&1 &)
          sleep 5; curl -sS -m 3 -o /dev/null -w 'http %{http_code}\n' http://127.0.0.1:18768/; echo "[curl exit $?]"
          pkill -f 'http.server 18768'; sleep 1; cat "$RUNNER_TEMP/http2.log"
          echo "== seatbelt tests without the dashboard build"
          mix test --only seatbelt --exclude qa_dashboard_e2e
          exit 1

      - name: Run the Seatbelt tests
        run: time mix test --only seatbelt
