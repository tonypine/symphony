name: seatbelt

# Runs the `:seatbelt` tests, which start commands under the verification dev server's real
# `sandbox-exec` profile: a read of a credential path fails, a connection off loopback fails, the
# egress proxy tunnels only to allowlisted hosts, and a dev server serves from inside the sandbox.
# `test/test_helper.exs` excludes them where `sandbox-exec` can't run, which is `make-all`'s
# Ubuntu runners and every agent run (Seatbelt can't nest), so they run here, on a macOS runner.
# `--only seatbelt` runs them even so, and fails when none is found.
#
# Not a required check: on a pull request that changes none of these paths the workflow doesn't
# run. Pushes to `main` that change them run it too, so it stays green there.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/symphony_elixir/verification/**"
      - "lib/symphony_elixir/agent_sandbox_config.ex"
      - "scripts/qa-dashboard-server.sh"
      - "test/symphony_elixir/verification/dev_server_sandbox_test.exs"
      - "test/symphony_elixir/verification_test.exs"
      - "test/test_helper.exs"
      - ".github/workflows/seatbelt.yml"
  push:
    branches:
      - main
    paths:
      - "lib/symphony_elixir/verification/**"
      - "lib/symphony_elixir/agent_sandbox_config.ex"
      - "scripts/qa-dashboard-server.sh"
      - "test/symphony_elixir/verification/dev_server_sandbox_test.exs"
      - "test/symphony_elixir/verification_test.exs"
      - "test/test_helper.exs"
      - ".github/workflows/seatbelt.yml"

permissions:
  contents: read

concurrency:
  group: seatbelt-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seatbelt:
    name: seatbelt tests
    runs-on: macos-15
    # One test builds this checkout with `scripts/qa-dashboard-server.sh` before it serves.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-seatbelt-mix-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-seatbelt-mix-

      - name: Show toolchain
        run: |
          sw_vers
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true && echo "sandbox-exec works"

      - name: Install dependencies
        run: time mix deps.get

      - name: Diagnose (temporary)
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/ws" "$RUNNER_TEMP/tmp"
          WS=$(cd "$RUNNER_TEMP/ws" && pwd -P); TMPD=$(cd "$RUNNER_TEMP/tmp" && pwd -P)
          MIX_ENV=test mix compile > /dev/null 2>&1
          MIX_ENV=test mix run --no-start -e "IO.write(SymphonyElixir.Verification.DevServerSandbox.profile(\"$WS\", [\"$WS\", \"$TMPD\"], [\".git\"]))" > "$RUNNER_TEMP/full.sb"
          PROBE="$RUNNER_TEMP/probe.py"
          cat > "$PROBE" <<'PY'
          import socket, sys
          mode = sys.argv[1]
          try:
              if mode == "bind":
                  s = socket.socket(); s.bind((sys.argv[2], 0)); s.listen(); print("bind", sys.argv[2], "OK", s.getsockname())
              elif mode == "serve":
                  s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  s.bind((sys.argv[2], int(sys.argv[3]))); s.listen(); s.settimeout(4)
                  c, a = s.accept(); print("accepted", a, c.recv(10))
              elif mode == "connect":
                  c = socket.create_connection((sys.argv[2], int(sys.argv[3])), timeout=3); c.send(b"hi"); print("connect", sys.argv[2], "OK")
          except Exception as e:
              print(mode, sys.argv[2:], type(e).__name__, e)
          PY
          IP=$(ipconfig getifaddr en0 || ipconfig getifaddr en1)
          L='"localhost:*"'
          DNS='(allow network-outbound (literal "/private/var/run/mDNSResponder"))'
          variant() {
            case "$1" in
              N0) echo "(allow network*)" ;;
              N1) echo "(deny network*)(allow network-bind (local ip $L))(allow network-inbound (local ip $L))(allow network-outbound (remote ip $L))$DNS" ;;
              N2) echo "(deny network*)(allow network-bind (local ip $L))(allow network-outbound (remote ip $L))$DNS" ;;
              N3) echo "(deny network*)(allow network-bind (local ip $L))(allow network-inbound (local ip $L))(allow network-outbound (local ip $L))$DNS" ;;
              N4) echo "(deny network*)(allow network-bind (local ip $L))(allow network-outbound (remote ip $L))(allow network-outbound (local ip $L))$DNS" ;;
              N5) echo "(deny network*)(allow network-inbound (local ip $L))(allow network-bind (local ip $L))(allow network-outbound (remote ip $L))$DNS" ;;
              N6) echo "(deny network*)(allow network* (local ip $L))(allow network-outbound (remote ip $L))$DNS" ;;
              N7) echo "(deny network*)(allow network-bind (local ip $L))(allow network-inbound (remote ip $L))(allow network-outbound (remote ip $L))$DNS" ;;
              N8) echo "(deny network*)(allow network-bind (local ip $L))(allow network-inbound (local ip $L))(allow network-inbound (remote ip $L))(allow network-outbound (remote ip $L))$DNS" ;;
              N9) echo "(deny network*)(allow network-inbound (local ip $L))(allow network-outbound (remote ip $L))$DNS(deny network-bind)(allow network-bind (local ip $L))" ;;
            esac
          }
          port=19000
          run_probes() {
            P="$1"
            SBX() { /usr/bin/sandbox-exec -p "$P" python3 "$PROBE" "$@" 2>&1 | tail -1; }
            echo "  $(SBX bind 0.0.0.0)"; echo "  $(SBX bind "$IP")"; echo "  $(SBX bind 127.0.0.1)"
            port=$((port+1)); /usr/bin/sandbox-exec -p "$P" python3 "$PROBE" serve 127.0.0.1 $port > "$RUNNER_TEMP/s.log" 2>&1 &
            sleep 1; echo "  host->sandbox 127.0.0.1: $(python3 "$PROBE" connect 127.0.0.1 $port)"; wait; echo "  sandbox server: $(tail -1 "$RUNNER_TEMP/s.log")"
            port=$((port+1)); python3 "$PROBE" serve 127.0.0.1 $port > "$RUNNER_TEMP/h.log" 2>&1 &
            sleep 1; echo "  sandbox->host 127.0.0.1: $(SBX connect 127.0.0.1 $port)"; wait
            port=$((port+1)); python3 "$PROBE" serve 0.0.0.0 $port > "$RUNNER_TEMP/h.log" 2>&1 &
            sleep 1; echo "  sandbox->host $IP: $(SBX connect "$IP" $port)"; wait
            echo "  sandbox->1.1.1.1:443: $(SBX connect 1.1.1.1 443)"
          }
          echo "== control (allow default)"; run_probes '(version 1)(allow default)'
          for v in N0 N1 N2 N3 N4 N5 N6 N7 N8 N9; do
            echo "== minimal $v: $(variant $v)"; run_probes "(version 1)(allow default)$(variant $v)"
            NET="$(variant $v)" python3 -c 'import os,re,sys; p=open(sys.argv[1]).read(); print(re.sub(r"\(deny network\*\).*?mDNSResponder\"\)\)", lambda m: os.environ["NET"], p, flags=re.S))' "$RUNNER_TEMP/full.sb" > "$RUNNER_TEMP/v.sb"
            grep -q "network" "$RUNNER_TEMP/v.sb" || echo "  (substitution failed)"
            echo "== full $v"; run_probes "$(cat "$RUNNER_TEMP/v.sb")"
          done
          echo "== full profile"; cat "$RUNNER_TEMP/full.sb"
          exit 1

      - name: Run the Seatbelt tests
        run: time mix test --only seatbelt
