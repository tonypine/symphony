name: release

# Builds Symphony.app with the self-contained Symphony release (`make release`,
# ERTS included) inside, run in place from Contents/Resources/symphony-release
# through the launcher at Contents/Resources/symphony, and publishes it as a
# GitHub Release, on every push to main, on pushed v* tags, and on demand.
#
# Versioning (monotonic and machine-comparable):
#   CFBundleVersion            = github.run_number            e.g. 42
#   CFBundleShortVersionString = <mix.exs version>.<run_number> e.g. 0.0.1.42
#   release tag                = v<short version>              e.g. v0.0.1.42
#   Elixir release version     = <mix.exs version>-<run_number> e.g. 0.0.1-42
# A pushed v* tag is released under its own name, with the same versions.
# version.json's `build` is the number to compare.
#
# Optional secrets. Without them the release still publishes:
#   MACOS_SIGNING_P12_BASE64, MACOS_SIGNING_P12_PASSWORD, MACOS_SIGNING_IDENTITY
#     sign with the Symphony certificate; without them the app is signed ad hoc
#     and version.json says "signed": false.
#   MINISIGN_SECRET_KEY, MINISIGN_PASSWORD
#     publish a .minisig; without them version.json says "minisig": null.
#
# Optional repository variable:
#   MINISIGN_PUBLIC_KEY
#     the key line of the matching minisign.pub, embedded in the app so it can
#     verify updates and quoted in the release notes; without it the app's Update
#     item is off.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Publish one release at a time, in push order, so releases/latest is the newest.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The release gate: every Mac check, from a clean build of this commit, on the self-hosted runner
  # (mac-checks.yml). Pull requests run only the groups their paths feed, so this is where the rest
  # run. Nothing is published from a commit that fails it: the app stays on its current version,
  # and Symphony, which reads this run on its `workflow_run` delivery, files an Urgent fix ticket
  # (lib/symphony_elixir/release_gate.ex; the job's name is how it tells the gate from the build).
  gate:
    name: release gate
    uses: ./.github/workflows/mac-checks.yml
    permissions:
      contents: read
    with:
      ref: main
      clean: true
      build: true
      unit: true
      sandbox: true
      helpers: true
      driver: true
      speed: true
      update: true
      smoke: true
      installer: true

  release:
    name: release
    needs: gate
    # The app targets macOS 26; the whole job builds with the Xcode pinned in
    # .xcode-version. Apple silicon, so the release and the app build natively. It runs on the
    # self-hosted runner, as the gate does, so a release never waits for one of GitHub's Macs.
    runs-on: [self-hosted, macOS, tahoe]
    env:
      SYMPHONY_CI_REF: main
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history and tags, for the commit subjects since the last release.
          fetch-depth: 0
          persist-credentials: false

      - name: Compute version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mix_version="$(grep -oE '@version "[0-9]+\.[0-9]+\.[0-9]+"' mix.exs | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$mix_version" ]; then
            echo "::error::Could not read the version from mix.exs."
            exit 1
          fi
          version="$mix_version.$RUN_NUMBER"
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="v$version"
          fi
          echo "Releasing $version (build $RUN_NUMBER) as $tag"
          {
            echo "version=$version"
            echo "build=$RUN_NUMBER"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Select the pinned Xcode
        run: echo "DEVELOPER_DIR=$(sh scripts/ci/xcode-developer-dir.sh)" >> "$GITHUB_ENV"

      # Homebrew's tools (minisign, jq) and mise's Erlang and Elixir, which the runner's service
      # does not have on its PATH.
      - name: Prepare the runner
        run: |
          # Only the tools the job names: all of Homebrew's bin would put its Python ahead of Xcode's.
          tools="$RUNNER_TEMP/tools"; rm -rf "$tools"; mkdir -p "$tools"
          for tool in mise minisign shellcheck jq socat; do ln -s "/opt/homebrew/bin/$tool" "$tools/$tool"; done
          echo "$tools" >> "$GITHUB_PATH"
          export PATH="$tools:$PATH"
          mise trust -q && mise install -q
          echo "$(dirname "$(mise which erl)")" >> "$GITHUB_PATH"
          echo "$(dirname "$(mise which elixir)")" >> "$GITHUB_PATH"

      - name: Build the Symphony release
        env:
          SYMPHONY_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          # The commit and repository the app is built from: Symphony holds a ticket blocked by
          # a fix in this repository until the running app includes the fix's merge commit.
          SYMPHONY_BUILD_SHA: ${{ github.sha }}
          SYMPHONY_BUILD_REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          make release
          test -x _build/prod/rel/symphony/bin/symphony-app

      - name: Import the signing certificate
        id: signing
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MACOS_SIGNING_P12_BASE64" ] || [ -z "$MACOS_SIGNING_P12_PASSWORD" ] || [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "No signing certificate configured; signing ad hoc."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/symphony-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          p12="$RUNNER_TEMP/symphony-signing.p12"
          (umask 077 && printf '%s' "$MACOS_SIGNING_P12_BASE64" | base64 --decode > "$p12")
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Put the temporary keychain first in the search list so codesign finds the identity.
          existing="$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" $existing
          echo "Imported the signing certificate into a temporary keychain."
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build Symphony.app
        working-directory: macos
        env:
          # Passed directly: step outputs that contain a secret are dropped.
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          SHORT_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          if [ "$SIGNED" = true ]; then
            identity="$MACOS_SIGNING_IDENTITY"
          else
            identity=-
          fi
          # The executable the gate built from nothing for this commit, from the build store; built
          # here, from nothing, when the store has none. A release never takes an incremental build.
          bash ../scripts/ci/build-store.sh app "$RUNNER_TEMP/release/SymphonyBar" --clean
          make bundle PREBUILT_EXECUTABLE="$RUNNER_TEMP/release/SymphonyBar" SYMPHONY_RELEASE="$GITHUB_WORKSPACE/_build/prod/rel/symphony" SIGNING_IDENTITY="$identity"
          codesign -dvv build/Symphony.app 2>&1 | grep -E '^(Identifier|Authority|Signature)=' || true
          ../scripts/release/smoke_test.sh build/Symphony.app/Contents/Resources/symphony "$GITHUB_WORKSPACE/symphony.yml"

      - name: Delete the temporary keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/symphony-signing.keychain-db"
          rm -f "$RUNNER_TEMP/symphony-signing.p12"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi

      - name: Install minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "No minisign key configured; skipping the .minisig asset."
            exit 0
          fi
          command -v minisign || brew install minisign

      - name: Package release assets
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          # Quoted in the release notes' minisign command.
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          TAG: ${{ steps.version.outputs.tag }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          COMMIT: ${{ github.sha }}
        run: |
          scripts/release/package.sh \
            --app macos/build/Symphony.app \
            --version "$VERSION" \
            --build "$BUILD_NUMBER" \
            --commit "$COMMIT" \
            --tag "$TAG" \
            --signed "$SIGNED" \
            --out dist
          cat dist/version.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Creates the tag at this commit if it does not exist yet.
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Symphony ${{ steps.version.outputs.version }}
          body_path: dist/release_notes.md
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            dist/Symphony-${{ steps.version.outputs.version }}.zip
            dist/Symphony-${{ steps.version.outputs.version }}.zip.sha256
            dist/Symphony-${{ steps.version.outputs.version }}.zip.minisig
            dist/version.json
