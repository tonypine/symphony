name: make-all

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Check formatting
        run: time mix format --check-formatted

  release-launcher:
    name: release launcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The arguments ChildLaunch.swift, SymphonyRunner.swift and smoke_test.sh pass
      # must reach the VM unchanged, after `-extra`.
      - name: Test the release launcher's argument contract
        run: scripts/release/launcher_test.sh

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: time mix deps.get

      # Boots an assembled plain `mix release` through the launcher.
      - name: Boot a real release through the launcher
        run: time scripts/release/launcher_boot_test.sh

  audit:
    name: audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Cache deps and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: time mix deps.get

      # A restored deps cache lets `mix deps.get` pass without checking advisories.
      - name: Audit dependencies
        run: time mix hex.audit

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Cache deps and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: time mix deps.get

      - name: Run lint
        run: time mix lint

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Cache deps and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: time mix deps.get

      - name: Build escript
        run: time mix escript.build

      # The release workflow runs this on the Burrito binary only on pushes to main,
      # so a change that breaks `symphony check` on the sample config fails here first.
      # The escript skips the service step; `release-smoke` runs it on the Burrito
      # binary when a pull request changes release-related paths.
      - name: Smoke-test the escript
        run: time scripts/release/smoke_test.sh bin/symphony "$GITHUB_WORKSPACE/symphony.yml"

  coverage:
    name: coverage (${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Cache deps and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: time mix deps.get

      # The `:bwrap` tests run the verification dev server's Linux sandbox for real.
      - name: Install the dev server sandbox tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 keeps unprivileged user namespaces from bwrap through AppArmor.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run coverage partition
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
        run: |
          set -o pipefail
          time mix test --cover --partitions 4 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Job logs need admin rights; annotations don't, so agents can read failures.
      - name: Annotate test failures
        if: failure()
        run: scripts/ci/annotate-test-failures.sh "$RUNNER_TEMP/test.log"

      - name: Upload coverage partition
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-${{ matrix.partition }}
          path: cover/${{ matrix.partition }}.coverdata
          if-no-files-found: error
          retention-days: 1

  coverage-report:
    name: coverage report
    runs-on: ubuntu-latest
    needs: coverage

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Cache deps and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: time mix deps.get

      - name: Download coverage partitions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-*
          path: cover
          merge-multiple: true

      - name: Enforce coverage threshold
        run: time mix test.coverage

  dialyzer:
    name: dialyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Cache deps and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache Dialyzer PLTs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.mix/*.plt
            ~/.mix/*.plt.hash
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-

      - name: Install dependencies
        run: time mix deps.get

      - name: Run Dialyzer
        run: time mix dialyzer --format short

  make-all:
    name: make-all
    runs-on: ubuntu-latest
    needs:
      - format
      - audit
      - lint
      - build
      - coverage-report
      - dialyzer
    if: ${{ always() }}

    steps:
      - name: Summarize gate results
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COVERAGE_RESULT: ${{ needs.coverage-report.result }}
          DIALYZER_RESULT: ${{ needs.dialyzer.result }}
        run: |
          echo "format: $FORMAT_RESULT"
          echo "audit: $AUDIT_RESULT"
          echo "lint: $LINT_RESULT"
          echo "build: $BUILD_RESULT"
          echo "coverage report: $COVERAGE_RESULT"
          echo "dialyzer: $DIALYZER_RESULT"

          failed=0
          for result in "$FORMAT_RESULT" "$AUDIT_RESULT" "$LINT_RESULT" "$BUILD_RESULT" "$COVERAGE_RESULT" "$DIALYZER_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          exit "$failed"
