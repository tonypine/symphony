name: make-all

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Check formatting
        run: time mix format --check-formatted

  release-launcher:
    name: release launcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The arguments ChildLaunch.swift, SymphonyRunner.swift and smoke_test.sh pass
      # must reach the VM unchanged, after `-extra`.
      - name: Test the release launcher's argument contract
        run: scripts/release/launcher_test.sh

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: time mix deps.get

      # Boots an assembled plain `mix release` through the launcher.
      - name: Boot a real release through the launcher
        run: time scripts/release/launcher_boot_test.sh

  audit:
    name: audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      # One cache per Mix env, saved for each commit on main. A pull request restores the
      # newest main entry by prefix, so it compiles only the files it changes.
      - name: Restore deps and build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build/dev/lib
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-
            ${{ runner.os }}-mix-dev-

      - name: Install dependencies
        run: time mix deps.get

      # A restored deps cache lets `mix deps.get` pass without checking advisories.
      - name: Audit dependencies
        run: time mix hex.audit

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Restore deps and build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build/dev/lib
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-
            ${{ runner.os }}-mix-dev-

      - name: Install dependencies
        run: time mix deps.get

      - name: Run lint
        run: time mix lint

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Restore deps and build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build/dev/lib
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-
            ${{ runner.os }}-mix-dev-

      - name: Install dependencies
        run: time mix deps.get

      - name: Build escript
        run: time mix escript.build

      # The release workflow runs this on the app's release only on pushes to main,
      # so a change that breaks `symphony check` on the sample config fails here first.
      # The escript skips the service step; `release-smoke` runs it on the app's
      # release when a pull request changes release-related paths.
      - name: Smoke-test the escript
        run: time scripts/release/smoke_test.sh bin/symphony "$GITHUB_WORKSPACE/symphony.yml"

      # A release that renames or removes a settings key ships its migration: the file an
      # operator on the previous release has still loads on this build.
      - name: Load the previous release's symphony.yml
        run: time scripts/ci/previous-release-config-check.sh bin/symphony

  coverage:
    name: coverage (${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Restore deps and build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build/test/lib
          key: ${{ runner.os }}-mix-test-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-
            ${{ runner.os }}-mix-test-

      - name: Install dependencies
        run: time mix deps.get

      - name: Test the apt install retry
        run: sh scripts/ci/apt-install-test.sh

      # The `:bwrap` tests run the verification dev server's Linux sandbox for real.
      # apt-install.sh retries a transient mirror or DNS failure (docs/development.md).
      - name: Install the dev server sandbox tools
        run: |
          scripts/ci/apt-install.sh bubblewrap socat
          # Ubuntu 24.04 keeps unprivileged user namespaces from bwrap through AppArmor.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run coverage partition
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
        run: |
          set -o pipefail
          time mix test --cover --partitions 4 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Shard 1 saves the test build for this commit; the other shards compile the same files.
      - name: Save deps and build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.partition == 1
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build/test/lib
          key: ${{ runner.os }}-mix-test-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-${{ github.sha }}

      # Job logs need admin rights; annotations don't, so agents can read failures.
      - name: Annotate test failures
        if: failure()
        run: scripts/ci/annotate-test-failures.sh "$RUNNER_TEMP/test.log"

      - name: Upload coverage partition
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-${{ matrix.partition }}
          path: cover/${{ matrix.partition }}.coverdata
          if-no-files-found: error
          retention-days: 1

  coverage-report:
    name: coverage report
    runs-on: ubuntu-latest
    needs: coverage

    steps:
      # A pull request's run checks out its merge commit; the first parent is the base branch, so
      # `HEAD^1..HEAD` is what the pull request changes.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Restore deps and build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build/test/lib
          key: ${{ runner.os }}-mix-test-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-
            ${{ runner.os }}-mix-test-

      - name: Install dependencies
        run: time mix deps.get

      - name: Download coverage partitions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-*
          path: cover
          merge-multiple: true

      # Main's last green report: which modules it had at 100%. A pull request restores the newest.
      - name: Restore main's coverage baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: coverage-baseline.json
          key: coverage-baseline-${{ github.sha }}
          restore-keys: |
            coverage-baseline-

      # Names the uncovered lines of every module below 100%, as log lines and annotations. On a
      # pull request, a module it doesn't touch and main had at 100% is a warning, not a failure.
      - name: Enforce coverage threshold
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            time mix coverage.report --annotate --base HEAD^1 --baseline coverage-baseline.json
          else
            time mix coverage.report --annotate --write-baseline coverage-baseline.json
          fi

      - name: Save main's coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: coverage-baseline.json
          key: coverage-baseline-${{ github.sha }}

  dialyzer:
    name: dialyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Restore deps and build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build/dev/lib
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-
            ${{ runner.os }}-mix-dev-

      # `mise.toml` pins Erlang to its major release only, so a runner image or mise update can
      # bring another patch release, and Dialyzer rejects a PLT its own version did not build.
      # The PLT cache key names the versions installed here, so a toolchain change misses it.
      - name: Read the Erlang, Elixir and Dialyzer versions
        id: toolchain
        run: |
          elixir -e '
            release = :erlang.system_info(:otp_release) |> to_string()
            otp =
              case File.read(Path.join([to_string(:code.root_dir()), "releases", release, "OTP_VERSION"])) do
                {:ok, version} -> String.trim(version)
                {:error, _} -> release
              end

            :ok = Application.load(:dialyzer)
            IO.puts("key=otp-#{otp}-elixir-#{System.version()}-dialyzer-#{Application.spec(:dialyzer, :vsn)}")
          ' | tee -a "$GITHUB_OUTPUT"

      # Dialyxir writes the Erlang and Elixir PLTs to Mix's home, which mise sets to its
      # Elixir install, and the deps PLT with its hash to `_build/dev`.
      - name: Locate Dialyzer PLTs
        run: |
          core="${MIX_HOME:-$HOME/.mix}"
          echo "Core PLTs: $core; deps PLT: _build/dev"
          echo "DIALYZER_CORE_PLT_DIR=$core" >> "$GITHUB_ENV"

      - name: Cache Dialyzer PLTs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.DIALYZER_CORE_PLT_DIR }}/dialyxir_*.plt
            _build/dev/dialyxir_*.plt
            _build/dev/dialyxir_*.plt.hash
          key: ${{ runner.os }}-dialyzer-${{ steps.toolchain.outputs.key }}-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-${{ steps.toolchain.outputs.key }}-

      - name: Install dependencies
        run: time mix deps.get

      # A restored PLT built by another Erlang patch release makes Dialyzer exit with "Old PLT
      # file" although dialyxir calls it up to date. The cache can't tell, so drop the PLTs and
      # build them again, once.
      - name: Run Dialyzer
        run: |
          set -o pipefail
          if ! time mix dialyzer --format short 2>&1 | tee dialyzer.log; then
            if grep -q "Old PLT file" dialyzer.log; then
              echo "::warning::Dialyzer rejected a cached PLT as old; rebuilding the PLTs"
              rm -f "$DIALYZER_CORE_PLT_DIR"/dialyxir_*.plt _build/dev/dialyxir_*.plt _build/dev/dialyxir_*.plt.hash
              time mix dialyzer --format short
            else
              exit 1
            fi
          fi

      - name: List Dialyzer PLTs
        run: |
          ls -l "$DIALYZER_CORE_PLT_DIR"/dialyxir_*.plt _build/dev/dialyxir_*.plt* ||
            echo "::warning::Dialyzer PLTs are not where the PLT cache looks"

      - name: Save deps and build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            deps
            _build/dev/lib
          key: ${{ runner.os }}-mix-dev-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}-${{ github.sha }}

  make-all:
    name: make-all
    runs-on: ubuntu-latest
    needs:
      - format
      - audit
      - lint
      - build
      - coverage-report
      - dialyzer
    # Not when the run is cancelled: a cancelled run's check reads cancelled, not failed,
    # so the PR watcher does not rerun it or send it to CI Fix.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: write

    steps:
      - name: Summarize gate results
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAT_RESULT: ${{ needs.format.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COVERAGE_RESULT: ${{ needs.coverage-report.result }}
          DIALYZER_RESULT: ${{ needs.dialyzer.result }}
        run: |
          echo "format: $FORMAT_RESULT"
          echo "audit: $AUDIT_RESULT"
          echo "lint: $LINT_RESULT"
          echo "build: $BUILD_RESULT"
          echo "coverage report: $COVERAGE_RESULT"
          echo "dialyzer: $DIALYZER_RESULT"

          # A job that never finished (cancelled, or abandoned while queued) in a run that is
          # not cancelled: cancel the run so the check reads cancelled, not failed.
          for result in "$FORMAT_RESULT" "$AUDIT_RESULT" "$LINT_RESULT" "$BUILD_RESULT" "$COVERAGE_RESULT" "$DIALYZER_RESULT"; do
            if [ "$result" = "cancelled" ] || [ "$result" = "abandoned" ]; then
              gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true
              sleep 60
              break
            fi
          done

          failed=0
          for result in "$FORMAT_RESULT" "$AUDIT_RESULT" "$LINT_RESULT" "$BUILD_RESULT" "$COVERAGE_RESULT" "$DIALYZER_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done

          exit "$failed"
