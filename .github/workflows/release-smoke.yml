name: release-smoke

# Builds the Symphony release and Symphony.app around it as the `release`
# workflow does, and runs the release smoke test on the app's launcher, on pull
# requests that change how the release is built or started. `make-all`'s `build`
# job smoke-tests only the escript, which skips the service-instance step (the
# release running as the service under the node name symphony@127.0.0.1,
# registered with epmd), so without this a break there would show up only in
# `release` after the merge.
#
# Not a required check: on a pull request that changes none of these paths the
# workflow doesn't run.
on:
  pull_request:
    paths:
      - "rel/**"
      - "mix.exs"
      - "mix.lock"
      - "mise.toml"
      - "Makefile"
      - "config/config.exs"
      - "config/runtime.exs"
      - "lib/symphony_elixir/cli.ex"
      - "lib/symphony_elixir/paths.ex"
      - "lib/symphony_elixir/release_node.ex"
      - "lib/symphony_elixir/release_cookie.ex"
      - "scripts/release/**"
      - "scripts/ci/xcode-developer-dir.sh"
      - ".xcode-version"
      - "macos/Package.swift"
      - "macos/Info.plist"
      - "macos/Makefile"
      - "symphony.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-smoke.yml"

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    name: release smoke
    # The same runner and Xcode as `release`.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Select the pinned Xcode
        run: echo "DEVELOPER_DIR=$(sh scripts/ci/xcode-developer-dir.sh)" >> "$GITHUB_ENV"

      - name: Set up mise tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: "erlang elixir"
          cache: true

      - name: Build the Symphony release
        env:
          # A build number, as `release` sets, so the release version is 0.0.1-N
          # like a published build's.
          SYMPHONY_BUILD_NUMBER: ${{ github.run_number }}
          SYMPHONY_BUILD_SHA: ${{ github.sha }}
          SYMPHONY_BUILD_REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          time make release
          test -x _build/prod/rel/symphony/bin/symphony-app

      # As `release` builds it, signed ad hoc: the signing certificate is a release secret.
      - name: Build Symphony.app
        working-directory: macos
        run: |
          time make bundle SYMPHONY_RELEASE="$GITHUB_WORKSPACE/_build/prod/rel/symphony" SIGNING_IDENTITY=-
          codesign --verify --strict --deep build/Symphony.app
          test -x build/Symphony.app/Contents/Resources/symphony
          test -f build/Symphony.app/Contents/Resources/symphony-release/releases/start_erl.data
          test "$(plutil -extract LSMinimumSystemVersion raw build/Symphony.app/Contents/Info.plist)" = 26.0

      - name: Smoke-test the app's Symphony
        run: time scripts/release/smoke_test.sh macos/build/Symphony.app/Contents/Resources/symphony "$GITHUB_WORKSPACE/symphony.yml"

      - name: Report the release zip size
        run: |
          ditto -c -k --keepParent macos/build/Symphony.app "$RUNNER_TEMP/Symphony.zip"
          echo "Symphony.zip: $(stat -f %z "$RUNNER_TEMP/Symphony.zip") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
