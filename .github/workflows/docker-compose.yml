name: docker-compose

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-compose.yml"
      - "docker/**"
      - "mise.toml"
      - "mix.exs"
      - "mix.lock"
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/docker-compose.yml"
      - "docker/**"
      - "mise.toml"
      - "mix.exs"
      - "mix.lock"

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: SYMPHONY_CONFIG="$PWD/test/fixtures/runtime/symphony.yml" SYMPHONY_REPOS_ROOT="$PWD" docker compose -f docker/docker-compose.yml config

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: symphony:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The verification dev server's sandbox: `bwrap`'s probe must pass under the shipped compose
      # file's security options.
      - name: Probe bwrap in the container
        run: |
          # Ubuntu 24.04 keeps unprivileged user namespaces from bwrap through AppArmor.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          mkdir -p ~/.codex ~/.claude ~/.ssh
          SYMPHONY_CONFIG="$PWD/test/fixtures/runtime/symphony.yml" SYMPHONY_REPOS_ROOT="$PWD" \
            docker compose -f docker/docker-compose.yml run --rm --no-deps --entrypoint bwrap symphony \
            --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/sh -c :
