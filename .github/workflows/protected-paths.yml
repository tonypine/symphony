name: protected-paths

# `github_sync_base` and `github_push_branch` refuse a Symphony branch whose own commits change a
# path the agent sandbox write-protects, but a `git push` from the agent's shell skips them. This
# checks the pull request itself.
#
# `pull_request_target` runs this file and the check's code from the base branch, so the pull
# request can't change them. Its commits are only read as git data, never run. No other trigger:
# `pull_request_review` would run the pull request's own copy of this file. A review doesn't
# start a run, so whoever approves re-runs the job.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: protected-paths-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  protected-paths:
    name: protected paths
    if: ${{ startsWith(github.event.pull_request.head.ref, 'auto/') }}
    runs-on: ubuntu-latest
    env:
      WAIVER_LABEL: protected-paths-approved

    steps:
      # A person who changed a protected path on the agent's branch on purpose waives the check
      # with the label, or with an approving review of the current head commit. The label counts
      # only when its last adder is a person other than the pull request's author, since the
      # agent may push and label as the author.
      - name: Look for a person's waiver
        id: waiver
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if jq -e --arg label "$WAIVER_LABEL" 'any(. == $label)' <<<"$LABELS" >/dev/null; then
            labeler=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/events" \
              --jq ".[] | select(.event == \"labeled\" and .label.name == \"$WAIVER_LABEL\") | \"\(.actor.login) \(.actor.type)\"" |
              tail -n 1)
            read -r login type <<<"$labeler"

            if [ -n "$login" ] && [ "$login" != "$PR_AUTHOR" ] && [ "$type" != "Bot" ]; then
              echo "Waived by the $WAIVER_LABEL label, added by $login."
              echo "waived=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Ignoring the $WAIVER_LABEL label: ${login:-nobody} added it, and only a person other than the author $PR_AUTHOR can."
          fi

          approvers=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq ".[] | select(.state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\" and .user.type != \"Bot\") | .user.login")

          if [ -n "$approvers" ]; then
            echo "Waived by the approving review of $(echo $approvers | tr ' ' ',')."
            echo "waived=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the base branch
        if: ${{ steps.waiver.outputs.waived != 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Fetch the pull request's commits
        if: ${{ steps.waiver.outputs.waived != 'true' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pull-request
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise tools
        if: ${{ steps.waiver.outputs.waived != 'true' }}
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true

      - name: Cache deps and build
        if: ${{ steps.waiver.outputs.waived != 'true' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock', 'mix.exs', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        if: ${{ steps.waiver.outputs.waived != 'true' }}
        run: mix deps.get

      - name: Check the pull request's own commits
        if: ${{ steps.waiver.outputs.waived != 'true' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! mix protected_paths.check --repo pull-request --base "origin/$BASE_REF" --head "$HEAD_SHA"; then
            echo "::error::This pull request's own commits change paths an agent must not edit (its skills, WORKFLOW.md, sandbox settings). Revert them, or, if a person made the change on purpose, have a person other than the author add the $WAIVER_LABEL label, or approve the pull request and re-run this job."
            exit 1
          fi
