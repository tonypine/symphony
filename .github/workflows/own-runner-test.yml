name: own-runner-test

# Temporary, this branch only: the release gate's set of checks on a push to this branch, to see
# the whole flow run through GitHub before the pull request. Nothing here is meant to merge.
on:
  push:
    branches:
      - ci/own-runner-test

permissions:
  contents: read

concurrency:
  group: own-runner-test
  cancel-in-progress: true

jobs:
  gate:
    name: release gate
    uses: ./.github/workflows/mac-checks.yml
    with:
      ref: gate-sample
      clean: true
      build: true
      unit: true
      sandbox: true
      helpers: true
      driver: true
      speed: true
      sheet: true
      update: true
      smoke: true
      installer: true
