name: own-runner-test

# Temporary, this branch only: the tests that drive a window, on the self-hosted runner `ci-macos`,
# to prove its session shows windows. Nothing here is meant to merge.
on:
  push:
    branches:
      - ci/own-runner-test

permissions:
  contents: read

concurrency:
  group: own-runner-test
  cancel-in-progress: true

jobs:
  windows:
    name: window tests on ci-macos
    runs-on: [self-hosted, macOS, tahoe]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Select the pinned Xcode
        run: echo "DEVELOPER_DIR=$(sh scripts/ci/xcode-developer-dir.sh)" >> "$GITHUB_ENV"
      - name: What is on screen
        run: |
          echo "cache: ${SYMPHONY_CI_CACHE:-unset}"
          osascript -e 'tell application "System Events" to get name of every process whose visible is true' || true
      - name: Test the QA driver's scrolling
        if: ${{ !cancelled() }}
        working-directory: macos
        run: time python3 -I Tests/qa-scroll-test.py
      - name: Test the QA driver's key shortcuts
        if: ${{ !cancelled() }}
        working-directory: macos
        run: time python3 -I Tests/qa-key-test.py
