name: macos

# `macos` is a required check, so the workflow runs on every pull request and the
# `changes` job decides whether to build. On pushes to `main` the path filter is enough.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "macos/**"
      - "priv/qa_driver/**"
      - "scripts/install-macos.sh"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.diff.outputs.macos }}

    steps:
      - name: Checkout
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check for macOS changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merged into its base, so HEAD^1 is the base.
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(macos/|priv/qa_driver/|scripts/install-macos\.sh$|\.github/workflows/macos\.yml$)'; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: macos build
    runs-on: macos-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build app
        working-directory: macos
        run: time make

      - name: Run tests
        working-directory: macos
        run: time swift test

      # An agent's sandbox can't write the per-user temp dir, where a sandboxed Foundation stages
      # its atomic writes, so a plain `swift build` fails there. Symphony gives a local macOS
      # Claude session the env that routes them elsewhere (`SymphonyElixir.AgentTmpDir.env/3`);
      # this builds and tests with that env in a sandbox that also denies those writes.
      - name: Build and test in a sandbox like an agent's
        working-directory: macos
        run: |
          profile='(version 1)(allow default)(deny file-write* (subpath "/private/var/folders"))'
          scratch="$RUNNER_TEMP/agent-sandbox"
          mkdir -p "$scratch/tmp"
          export TMPDIR="$scratch/tmp" SWIFTPM_MODULECACHE_OVERRIDE="$scratch/tmp/swiftpm-module-cache"
          if sandbox-exec -p "$profile" swift build --disable-sandbox --build-system native --scratch-path "$scratch/build" > "$scratch/without-env.log" 2>&1; then
            echo "swift build passed in the sandbox without DIRHELPER_USER_DIR_SUFFIX, so the sandbox no longer stands in for an agent's"
            exit 1
          fi
          tail -n 3 "$scratch/without-env.log"
          export DIRHELPER_USER_DIR_SUFFIX=symphony/none
          time sandbox-exec -p "$profile" swift build --disable-sandbox --build-system native --scratch-path "$scratch/build"
          time sandbox-exec -p "$profile" swift test --disable-sandbox --build-system native --scratch-path "$scratch/build"

      - name: Test the update helper
        working-directory: macos
        run: time sh Tests/update-helper-test.sh

  install-script:
    name: install script
    runs-on: macos-latest
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.macos == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install shellcheck and minisign
        run: brew install shellcheck minisign

      - name: Shellcheck
        run: shellcheck scripts/install-macos.sh

      - name: Install the latest release
        env:
          INSTALL_DIR: ${{ runner.temp }}/Applications
          SYMPHONY_NO_OPEN: "1"
        run: |
          bash scripts/install-macos.sh
          # A second run finds it installed and changes nothing.
          bash scripts/install-macos.sh

      - name: Check the installed app's signature
        env:
          APP: ${{ runner.temp }}/Applications/Symphony.app
        run: |
          details="$(codesign -dvv "$APP" 2>&1)"
          echo "$details" | grep -E '^(Identifier|Authority|Signature|TeamIdentifier)=' || true
          case "$details" in
            *"Identifier=com.tonypine.symphony.bar"*) ;;
            *) echo "::error::$APP is not com.tonypine.symphony.bar"; exit 1 ;;
          esac
          # The runner doesn't trust the Symphony certificate, so codesign may stop
          # at the trust check; any other failure is a broken signature.
          for target in "$APP" "$APP/Contents/Resources/symphony"; do
            if ! output="$(codesign --verify --strict "$target" 2>&1)"; then
              echo "$output"
              case "$output" in
                *CSSMERR_TP_NOT_TRUSTED*) echo "$target: signed with a certificate this runner doesn't trust" ;;
                *) echo "::error::$target has an invalid code signature"; exit 1 ;;
              esac
            fi
          done
          if [ -n "$(find "$APP" -xattrname com.apple.quarantine -print -quit)" ]; then
            echo "::error::$APP still has the quarantine flag"
            exit 1
          fi

  # The required check. It passes when nothing under macos/ changed (build skipped)
  # or the build passed, and fails when change detection or the build failed.
  macos:
    name: macos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - build
    if: ${{ always() }}

    steps:
      - name: Summarize gate results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES_RESULT"
          echo "build: $BUILD_RESULT"

          if [ "$CHANGES_RESULT" != "success" ]; then
            exit 1
          fi
          case "$BUILD_RESULT" in
            success | skipped) ;;
            *) exit 1 ;;
          esac
