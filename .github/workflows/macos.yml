name: macos

# The Mac checks of a pull request. `macos` is a required check, so the workflow runs on every
# pull request; the `changes` job reads what the pull request changed and turns on only the groups
# of checks those paths feed (mac-checks.yml, one job on the self-hosted runner). A pull request
# that changes none of them runs no Mac job at all.
#
# What a pull request skips is not skipped for good: every group runs on main, from a clean build,
# as the release gate (release.yml), before anything is published. While that gate is red on main,
# every pull request runs every group, so the pull request that fixes it proves the fix before the
# merge, and no other pull request merges onto a broken main unchecked.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      any: ${{ steps.groups.outputs.any }}
      build: ${{ steps.groups.outputs.build }}
      unit: ${{ steps.groups.outputs.unit }}
      sandbox: ${{ steps.groups.outputs.sandbox }}
      helpers: ${{ steps.groups.outputs.helpers }}
      driver: ${{ steps.groups.outputs.driver }}
      speed: ${{ steps.groups.outputs.speed }}
      update: ${{ steps.groups.outputs.update }}
      smoke: ${{ steps.groups.outputs.smoke }}
      installer: ${{ steps.groups.outputs.installer }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Choose the groups of checks
        id: groups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # HEAD is the pull request merged into its base, so HEAD^1 is the base.
          git diff --name-only HEAD^1 HEAD > changed.txt
          cat changed.txt
          gate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release --branch main --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""' || true)"
          echo "the release gate's last run on main: ${gate:-unknown}"
          sh scripts/ci/mac-check-groups.sh "$gate" < changed.txt | tee -a "$GITHUB_OUTPUT"

  checks:
    name: checks
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    uses: ./.github/workflows/mac-checks.yml
    with:
      ref: ${{ github.head_ref }}
      fail_fast: true
      build: ${{ needs.changes.outputs.build == 'true' }}
      unit: ${{ needs.changes.outputs.unit == 'true' }}
      sandbox: ${{ needs.changes.outputs.sandbox == 'true' }}
      helpers: ${{ needs.changes.outputs.helpers == 'true' }}
      driver: ${{ needs.changes.outputs.driver == 'true' }}
      speed: ${{ needs.changes.outputs.speed == 'true' }}
      update: ${{ needs.changes.outputs.update == 'true' }}
      smoke: ${{ needs.changes.outputs.smoke == 'true' }}
      installer: ${{ needs.changes.outputs.installer == 'true' }}

  # The required check. It passes when no group was needed or the checks passed, and fails when
  # choosing the groups or a check failed. It does not run when the run is cancelled (a newer push
  # on the pull request supersedes it), so the superseded head's check reads cancelled, not failed,
  # and the PR watcher does not rerun it or send it to CI Fix.
  macos:
    name: macos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - checks
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: write

    steps:
      - name: Summarize gate results
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "changes: $CHANGES_RESULT"
          echo "checks: $CHECKS_RESULT"

          if [ "$CHANGES_RESULT" != "success" ]; then
            exit 1
          fi
          case "$CHECKS_RESULT" in
            success | skipped) ;;
            cancelled | abandoned)
              # The run is not cancelled, yet the checks never finished (a timeout, or an attempt
              # abandoned while queued). Cancel the run so the check reads cancelled, not failed:
              # the PR watcher reruns it without a CI Fix run, and the required gate never passes
              # without the checks.
              echo "::warning::The checks were $CHECKS_RESULT; cancelling the run"
              gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true
              sleep 60
              exit 1
              ;;
            *) exit 1 ;;
          esac
