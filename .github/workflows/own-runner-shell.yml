name: own-runner-shell

# Temporary, this branch only: a channel to run the window-list diagnostics
# (macos/Tests/qa-window-diag.sh) inside the ci-macos runner's own session, on manual
# trigger. Exists while the Mac's access to the VMs is blocked; nothing here is meant
# to merge.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: diagnose on ci-macos
    runs-on: [self-hosted, macOS, tahoe]
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Select the pinned Xcode
        run: echo "DEVELOPER_DIR=$(sh scripts/ci/xcode-developer-dir.sh)" >> "$GITHUB_ENV"

      - name: Run the diagnostics
        run: time sh macos/Tests/qa-window-diag.sh
