name: macos-e2e

# Builds releases N and N+1 of Symphony.app from this commit and tests the menu
# bar app's Update, Restart and rollback end to end in an isolated instance
# (`make -C macos e2e`, see macos/Tests/e2e/README.md). It builds two Burrito
# binaries, so it runs nightly, on demand, and on pull requests that change the
# app, the release packaging or this test, rather than in the required `macos`
# check.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "macos/**"
      - "rel/**"
      - "mix.exs"
      - "mix.lock"
      - "scripts/release/**"
      - "scripts/zig-sdk-shim/**"
      - "scripts/ci/xcode26-developer-dir.sh"
      - "lib/symphony_elixir/tracker/memory.ex"
      - ".github/workflows/macos-e2e.yml"

permissions:
  contents: read

concurrency:
  group: macos-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: update, restart and rollback
    # The app targets macOS 26 (DD3), so it runs only on 26 or later. Zig links the
    # Burrito wrapper against the macOS 26 SDK through scripts/zig-sdk-shim.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true

      - name: Install minisign
        run: brew install minisign

      - name: Select Xcode 26
        run: echo "DEVELOPER_DIR=$(sh scripts/ci/xcode26-developer-dir.sh)" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          python3 --version

      - name: Run the end-to-end test
        env:
          # The runner may trust the throwaway signing certificate for code
          # signing (with sudo) until the test ends.
          SYMPHONY_E2E_TRUST_CERT: "1"
          SYMPHONY_E2E_WORK_ROOT: ${{ runner.temp }}/symphony-e2e
        run: make -C macos e2e

      - name: Upload the test's folder
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-e2e
          path: |
            ${{ runner.temp }}/symphony-e2e/
            !${{ runner.temp }}/symphony-e2e/*/signing/
            !${{ runner.temp }}/symphony-e2e/*/minisign/
            !${{ runner.temp }}/symphony-e2e/*/build-*/
            !${{ runner.temp }}/symphony-e2e/*/feed/
            !${{ runner.temp }}/symphony-e2e/*/bin/symphony-*
            !${{ runner.temp }}/symphony-e2e/*/Applications/
            !${{ runner.temp }}/symphony-e2e/*/qa/burrito/
          retention-days: 7
