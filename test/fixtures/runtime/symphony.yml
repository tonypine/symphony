issues:
  provider: memory
repositories:
  - key: runtime-test
    default: true
    workflow: WORKFLOW.md
    workflow_source: local
workspaces:
  root: /tmp/symphony-elixir-runtime-test-workspaces
execution:
  harnesses:
    codex:
      command: codex app-server
  concurrency:
    max_total: 1
runs:
  default: { harness: codex, provider: openai, model: gpt-test }
pull_requests:
  enabled: false
  checks:
    enabled: false
issue_gate:
  enabled: false
watchdog:
  enabled: false
notifications:
  enabled: false
