dashboard:
  # Terminal dashboard on Symphony's own output; the web dashboard and control API stay up either way.
  # enabled: true
  # host: 127.0.0.1
  # port: 0
  # refresh_ms: 1000
  # render_interval_ms: 16
  # snapshot_publish_ms: 500
  transcript_buffer_size: 200

issue_gate:
  enabled: false
  provider: anthropic
  model: claude-haiku-4-5-20251001
  pass_threshold: 6
  clarification_floor: 4
  max_clarification_rounds: 2
  on_error: pass

watchdog:
  enabled: true
  tick_interval_ms: 60000
  no_progress_threshold_ms: 600000

# dependency_audit:
