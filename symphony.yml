# Symphony operator config - Codex runner.
# See docs/configuration.md for the full reference. Commented values show defaults
# or optional advanced knobs.

issues:
  provider: linear
  poll_interval_ms: 15000
  linear:
    # endpoint: https://api.linear.app/graphql
    # api_key: $LINEAR_API_KEY
    assignee: me
    scope:
      # project_slug: my-project
      # team: ENG
      # labels: [codex]
  states:
    active: [Todo, In Progress, Merging, Rework]
    terminal: [Closed, Cancelled, Canceled, Duplicate, Done, "Won't Do"]

repositories:
  - key: symphony
    # default: true
    # base_branch: main
    workflow: WORKFLOW.md
    route:
      # team: ENG
      # labels: [backend]
      # assignee: me
      projects: ["building-the-harness-ai-agents-that-ship-production-code-safely-f469eb38bbc5"]
    workspace:
      strategy: worktree
      repo: ~/Projects/symphony
      fetch_before_dispatch: true
      # Or let Symphony clone the repo itself instead of using `repo` (drop `repo` then):
      # source: your-org/symphony

workspaces:
  root: ~/Projects/symphony-workspaces
  # clones_root: ~/.local/share/symphony/repos   # Symphony's clones of `workspace.source` repos
  # strategy: clone
  # repo: ~/Projects/symphony
  # fetch_before_dispatch: true
  # attachments:
  #   allowed_hosts: [github.com]
  #   public_upload_extensions: [.png, .jpg, .jpeg, .gif, .webp, .svg, .pdf]
  cleanup:
    # enabled: true
    max_age_days: 14
    interval_ms: 3600000
    # min_free_bytes: 10737418240
    orphan_action: log
    trash_dir: .trash

# workers:
#   ssh_hosts: []
#   max_concurrent_agents_per_host: 2

# github:
#   enterprise_hosts: []
#   failed_run_log_max_bytes: 65536
#   # CI results through a webhook relay; see docs/github-webhooks.md. Needs a fixed dashboard.port.
#   webhooks:
#     enabled: false
#     relay: smee   # smee | cloudflare_tunnel | gh_webhook_forward
#     secret: $GITHUB_WEBHOOK_SECRET

agent:
  runtime: codex
  command: codex --config shell_environment_policy.inherit=all --config 'model="gpt-5.5"' --config model_reasoning_effort=high app-server
  # Model and effort per kind of run. Drop the model and effort flags from `command` when
  # setting any of these. Kinds: implementation, breakdown, close_out,
  # final_verification, rework, landing, ci_fix, review_feedback, pre_push_review, qa.
  # `provider: openrouter` (default `anthropic`) needs `runtime: claude`; see symphony.claude.yml.
  # model: gpt-5.5
  # effort: medium   # low | medium | high | xhigh | max
  # run_profiles:
  #   breakdown: { effort: xhigh }
  #   landing: { effort: low }
  concurrency:
    max_total: 10
    # epic_lanes: 9   # slots in-progress epics may reserve (default: max_total)
    # finishing_max: 2   # landing runs allowed on top of max_total (default: 2)
    # force_label: expedite   # label that forces a ticket through every phase (default: expedite)
    # forced_max: 1   # forced runs at once, outside max_total and the other caps (default: 1)
    # forced_stale_after_hours: 72   # hours before a forced ticket counts as stale (default: 72)
    # max_by_issue_state:
    #   rework: 2
  limits:
    max_turns: 8
    retry_backoff_max_ms: 300000
    tokens_per_issue: 100000000
    tokens_per_day: 1000000000
  prompts:
    # include_project_guides: true
    # project_guide_files:
  permissions:
    approval_policy: auto_approve_all
    filesystem:
      sandbox: workspace-write
      turn_policy:
        type: workspaceWrite
        networkAccess: true
        # writableRoots: []
      # allow_read_paths: []
    network:
      mode: allowlist
      # allowed_domains: []
      # denied_domains: []
    outer_sandbox:
      # runtime: srt
      command: srt
      enable_weaker_network_isolation: false
  mcp:
    inherit: none
    # allowed_servers: []
    # servers: {}
  timeouts:
    # turn_ms: 3600000
    # read_ms: 30000
    # stall_ms: 300000
    # command_ms: 600000

pre_push_review:
  enabled: true
  runtime: claude
  command: claude --model claude-opus-4-7 --dangerously-skip-permissions
  # Or drop `--model` from `command` and set the model and effort here; else
  # agent.run_profiles.pre_push_review, then agent.model / agent.effort.
  # model: claude-opus-5-5
  # effort: high
  max_iterations: 1
  run_on: first_push

# Auto Review: once the PR is open, Symphony moves the issue to `state` instead of
# In Review and waits for CI there. Red CI goes back to In Progress; green CI runs
# a QA agent on the PR head (skipped for docs/test-only or internal changes), then
# moves the issue to In Review on pass, or back to In Progress with the findings on
# fail. Needs a Linear state with this name (type started, between In Progress and
# In Review) and `pull_requests.checks.enabled: true`.
# auto_review:
#   enabled: false
#   state: Auto Review
#   runtime: claude
#   command: claude --dangerously-skip-permissions
#   model: claude-sonnet-5-5   # else agent.run_profiles.qa, then agent.model
#   effort: medium
#   max_turns: 20
#   timeout_ms: 1800000
#   max_concurrent: 1
#   max_fix_attempts: 2
#   run_on: every_push
#   skip_globs: []
#   playbooks: {}

pull_requests:
  enabled: true
  poll_interval_ms: 30000
  # Land Merging tickets with GitHub auto-merge instead of a landing agent.
  # auto_merge: true
  review_comments:
    rework_delay_minutes: 1
    # stale_after_days: 7
    # Accounts whose PR comments are skipped (no rework, no reply). Scope this to
    # bots that post automated, non-actionable status (coverage, CI, template
    # reminders). Do NOT add review bots like copilot-pull-request-reviewer[bot]
    # or coderabbitai[bot] here -- their comments are genuine, actionable reviews.
    ignored_reviewers:
      - github-actions[bot]
      - jp-launch-control[bot]
    reply_after_addressing: true
    # request_review_after_push: false
  checks:
    enabled: true
    log_excerpt_lines: 200
    retry_failed_once: true
    max_fix_attempts: 3
    escalate_to_state: In Review
  # learnings:
  #   enabled: false
  #   provider: anthropic
  #   model: claude-haiku-4-5-20251001
  #   max_total_per_repo: 500
  #   max_per_run: 3

