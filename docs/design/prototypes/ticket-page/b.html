<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B · Stage · Ticket page prototype</title>
  <link rel="stylesheet" href="../../catalog/tokens.css">
  <link rel="stylesheet" href="../../catalog/components.css">
  <link rel="stylesheet" href="kit.css">
  <style>
    /*
     * B · Stage. The top of the page is a stage that answers the first two questions alone: does
     * anything need me (the Question, right there), and where does it stand and why (one sentence,
     * the phases it went through, the tokens). Under it the page splits in two: the run, step by
     * step and live, beside the history of the ticket, where picking a run shows it in the run pane.
     * On a desktop the facts leave the band under the split and become a third pane.
     */
    .b-page { display: grid; gap: var(--space-6); }
    .b-page .page-header h1 { font: 650 20px/26px var(--font-display); letter-spacing: -0.016em; margin: 4px 0 0; }
    .b-stage { display: grid; gap: var(--space-5); padding: var(--space-6); border-radius: var(--radius-sheet); background: var(--surface-content); box-shadow: var(--elevation-2), var(--edge-highlight); }
    .b-stage-top { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--space-8); align-items: start; }
    .b-sentence { display: grid; gap: var(--space-2); }
    .b-sentence .word-line { display: flex; align-items: center; gap: var(--space-3); font: var(--type-title); letter-spacing: var(--tracking-display); color: var(--role-text); text-wrap: balance; }
    .b-sentence .word-line .glyph { width: 26px; height: 26px; color: var(--role); }
    .b-sentence .why { font: 400 16px/23px var(--font-text); color: var(--text-primary); max-width: var(--measure); }
    .b-sentence .next { font: var(--type-body); color: var(--text-secondary); max-width: var(--measure); }
    .b-sentence .since { display: inline-flex; align-items: center; gap: 6px; font: var(--type-secondary); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .b-stage-side { display: grid; gap: var(--space-4); }
    .b-stage .question-block { padding-top: var(--space-5); border-top: 1px solid var(--stroke-separator); }
    .b-stage .quiet-line { box-shadow: none; background: var(--surface-raised); }

    .b-lower { display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-areas: "run history" "facts facts"; gap: var(--space-6); align-items: start; }
    .b-pane { display: grid; gap: var(--space-4); align-content: start; min-width: 0; padding: var(--space-4) var(--space-5) var(--space-5); border-radius: var(--radius-card); background: var(--surface-content); box-shadow: var(--elevation-1), var(--edge-highlight); }
    .b-run { grid-area: run; }
    .b-history { grid-area: history; }
    .b-pane-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
    .b-pane-head h2 { font: var(--type-heading); }
    .b-pane-head .t-secondary { margin-left: auto; }
    .b-runs { display: flex; flex-wrap: wrap; gap: var(--space-1); }
    .b-runs .chip { height: 24px; }
    .b-runs .chip[aria-pressed="true"] { color: var(--text-on-accent); background: var(--accent-fill); box-shadow: var(--accent-glow); }
    .b-runs .chip[aria-pressed="true"] .glyph { color: var(--text-on-accent); }
    .b-run-title { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
    .b-run-title h3 { font: var(--type-sentence); letter-spacing: -0.012em; }
    .b-run .run-meta { padding: 0; }
    .b-run-body { display: grid; gap: var(--space-3); animation: ds-enter var(--motion-standard) var(--ease-spring); }
    .b-history .timeline { max-height: none; }
    .b-history .tl-entry { grid-template-columns: 44px 26px 1fr; }
    .b-history .timeline .tl-entry:not(:last-child)::before { left: calc(var(--space-2) + 44px + var(--space-2) + 12px); }
    .b-history .tl-day, .b-history .tl-since { padding-left: 62px; }
    .b-facts { grid-area: facts; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5) var(--space-6); align-items: start; }

    @container page (min-width: 1600px) {
      .b-stage-top { grid-template-columns: minmax(0, 1fr) 520px; }
      .b-lower { grid-template-columns: 560px minmax(0, 1fr) 440px; grid-template-areas: "history run facts"; column-gap: var(--space-8); }
      .b-facts { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <script src="../../catalog/stories.js"></script>
  <script src="fixtures.js"></script>
  <script src="kit.js"></script>
  <script>
    (function () {
      "use strict";
      const P = PROTO.parts;
      const esc = PROTO.esc;
      const icon = PROTO.icon;
      const K = PROTO.K;

      function sentence(v) {
        const s = v.situation;
        return '<div class="b-sentence role-' + s.role + '"><p class="word-line">' + icon(s.glyph) + "<span>" + esc(s.word) + "</span></p>" +
          '<p class="why">' + esc(s.cause) + "</p>" + (s.waits ? '<p class="next">' + esc(s.waits) + "</p>" : "") +
          '<span class="since">' + icon("clock") + "for " + esc(s.age) + " · since " + esc(s.since === "now" ? "just now" : PROTO.hm(s.since)) + "</span></div>";
      }

      function pickedRun(v, ui) {
        return v.runs.find((r) => r.id === ui.bRun) || v.live || v.runs[v.runs.length - 1];
      }

      function runPane(v, ui) {
        const run = pickedRun(v, ui);
        const chips = '<div class="b-runs" role="radiogroup" aria-label="Pick a run">' + v.runs.slice().reverse().map((r) => {
          const vd = P.VERDICTS[r.verdict];
          return '<button type="button" class="chip chip-status role-' + vd.role + '" role="radio" aria-pressed="' + (r.id === run.id) + '" aria-checked="' + (r.id === run.id) + '" data-brun="' + r.id + '" title="' + esc(r.title + ", " + vd.word.toLowerCase()) + '">' +
            icon(vd.glyph) + esc(r.kind === "Implementation" ? "Run " + r.n : r.kind + " " + r.n) + "</button>";
        }).join("") + "</div>";
        const vd = P.VERDICTS[run.verdict];
        const fs = v.findings.filter((f) => f.run === run.id).map(P.findingCard).join("");
        const body = '<div class="b-run-body" id="b-run-body"><div class="b-run-title">' + (run.live ? '<span class="dot live role-working"></span>' : "") + "<h3>" + esc(run.title) + "</h3>" + K.badge(vd.role, vd.word) + P.miniSteps(run) + "</div>" +
          P.runMeta(run) + fs + K.stepList({ steps: P.stepsOf(run, ui) }) + "</div>";
        return '<div class="b-pane-head"><h2>' + (run.live ? "Running now" : "Run") + '</h2><span class="t-secondary">' + v.runs.length + " runs · " + esc(PROTO.dur(v.totalMinutes)) + "</span></div>" + chips + body;
      }

      function render(v, ui) {
        const stage = '<section class="b-stage" aria-label="Where it stands"><div class="b-stage-top">' + sentence(v) +
          '<div class="b-stage-side">' + P.phasePath(v) + P.tokens(v) + "</div></div>" +
          (v.openQuestion ? P.question(v) : P.nothingNeedsYou(v)) + "</section>";
        const history = '<section class="b-pane b-history" aria-label="History"><div class="b-pane-head"><h2>History</h2><span class="t-secondary">' +
          esc(v.unseenCount ? v.unseenCount + " new since " + PROTO.hm(v.lastSeen) : "Nothing new since you looked") + "</span></div>" + P.filterChips(v, ui) +
          P.timeline(v, ui, { runRow: (it) => P.runRow(it, ui) }) + "</section>";
        const facts = '<div class="b-facts">' + P.prPanel(v, { foldChecks: true }) + P.connected(v) + P.notePanel(v) + P.decisions(v) + P.attachments(v) + P.brief(v) + P.details(v) + "</div>";
        return '<div class="b-page">' + P.header(v, { noStatus: true }) + stage +
          '<div class="b-lower"><section class="b-pane b-run" id="b-run" aria-label="Run">' + runPane(v, ui) + "</section>" + history + facts + "</div></div>";
      }

      function showRun(id) {
        const st = PROTO.state();
        st.ui.bRun = id;
        document.getElementById("b-run").innerHTML = runPane(st.view, st.ui);
      }

      PROTO.start({
        id: "b",
        name: "B · Stage",
        idea: "A stage on top says where it stands and asks the Question; below, the run beside the history.",
        render: render,
        onSelect: function (id, v) { if (id && v.runs.some((r) => r.id === id)) showRun(id); },
        onClick: function (e) { const c = e.target.closest("[data-brun]"); if (c) { PROTO.select(c.dataset.brun, { keep: true }); } },
      });
    })();
  </script>
</body>
</html>
