<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C · Desk · Ticket page prototype</title>
  <link rel="stylesheet" href="../../catalog/tokens.css">
  <link rel="stylesheet" href="../../catalog/components.css">
  <link rel="stylesheet" href="kit.css">
  <style>
    /*
     * C · Desk. The page is a desk of cards, each answering one question: what needs me, where it
     * stands, what runs now, what happened since I looked, then the pull request, the findings and
     * the facts. The full timeline is a drawer: it slides over the cards on a laptop and stays
     * docked on the right on a desktop. Any line of "Since you last looked" opens the drawer at it.
     */
    .c-page { display: grid; gap: var(--space-6); }
    .c-wrap { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; }
    .c-grid { grid-area: 1 / 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5) var(--space-6); align-items: start; transition: opacity var(--motion-standard) var(--ease-standard), filter var(--motion-standard) var(--ease-standard); }
    .c-span { grid-column: 1 / -1; }
    .c-col { display: grid; gap: var(--space-5); align-content: start; min-width: 0; }
    .c-card .panel { gap: var(--space-3); }
    .c-card .situation { max-width: none; }
    .c-card .tl-entry { grid-template-columns: 44px 26px 1fr; }
    .c-more { display: flex; justify-content: flex-end; }
    .c-drawer { grid-area: 1 / 1; justify-self: end; position: sticky; top: var(--space-4); z-index: 4; display: none; grid-template-rows: auto auto minmax(0, 1fr); width: 600px; max-height: calc(100vh - 140px); min-height: 520px; border-radius: var(--radius-sheet); background: var(--material-glass-thick); -webkit-backdrop-filter: var(--material-blur); backdrop-filter: var(--material-blur); box-shadow: var(--elevation-4), inset 0 0 0 1px var(--material-edge); overflow: hidden; }
    .c-wrap.drawer-open .c-drawer { display: grid; animation: c-drawer-in var(--motion-spring) var(--ease-spring); }
    .c-wrap.drawer-open .c-grid { opacity: 0.45; filter: saturate(0.6); pointer-events: none; }
    .c-wrap.drawer-open { cursor: pointer; }
    .c-wrap.drawer-open .c-drawer { cursor: auto; }
    .c-drawer-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-4) var(--space-4) var(--space-3) var(--space-5); border-bottom: 1px solid var(--stroke-separator); }
    .c-drawer-head h2 { font: var(--type-heading); }
    .c-drawer-head .t-secondary { margin-right: auto; }
    .c-drawer .tl-filters { padding: var(--space-3) var(--space-5) 0; }
    .c-drawer-body { overflow: auto; overscroll-behavior: contain; padding: var(--space-3) var(--space-3) var(--space-5); }
    @keyframes c-drawer-in {
      from { opacity: 0; transform: translateX(32px); }
    }

    @container page (min-width: 1600px) {
      .c-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .c-wrap.drawer-open { grid-template-columns: minmax(0, 1fr) 640px; column-gap: var(--space-8); }
      .c-wrap.drawer-open { cursor: auto; }
      .c-wrap.drawer-open .c-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); opacity: 1; filter: none; pointer-events: auto; }
      .c-wrap.drawer-open .c-drawer { grid-area: 1 / 2; width: auto; justify-self: stretch; max-height: calc(100vh - 120px); background: var(--surface-content); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: var(--elevation-1), var(--edge-highlight); border-radius: var(--radius-card); }
      .c-wide-2 { grid-column: span 2; }
    }
  </style>
</head>
<body>
  <script src="../../catalog/stories.js"></script>
  <script src="fixtures.js"></script>
  <script src="kit.js"></script>
  <script>
    (function () {
      "use strict";
      const P = PROTO.parts;
      const esc = PROTO.esc;
      const icon = PROTO.icon;
      const K = PROTO.K;

      const card = (title, body, cls) => '<section class="facts-group c-card' + (cls ? " " + cls : "") + '"><h3 class="zone-title">' + esc(title) + '</h3><div class="panel">' + body + "</div></section>";

      function drawerOpen(ui) {
        return ui.drawer !== undefined ? ui.drawer : PROTO.state().prefs.width === "desktop";
      }

      function render(v, ui) {
        const open = drawerOpen(ui);
        const tlButton = K.button({ label: "Timeline", glyph: "calendar" }).replace("<button ", '<button aria-expanded="' + open + '" aria-controls="c-drawer" data-drawer ').replace("</button>", ' <span class="count count-quiet">' + v.items.length + "</span></button>");
        const needs = v.openQuestion ? '<div class="c-span">' + P.question(v) + "</div>" : '<div class="c-span">' + P.nothingNeedsYou(v) + "</div>";
        const where = card("Where it stands", P.situation(v) + P.phasePath(v), "c-wide-2");
        const now = card("Running now", P.runNowPanel(v, ui), "c-wide-2");
        const since = card("Since you last looked, at " + PROTO.hm(v.lastSeen), P.sinceList(v, ui, { max: 6 }) + '<div class="c-more">' + K.button({ label: "Open the Timeline", variant: "quiet", size: "small" }).replace("<button ", "<button data-drawer-open ") + "</div>", "c-wide-2");
        const findings = card("Findings", v.findings.length ? v.findings.map(P.findingCard).join("") : '<p class="empty-line">No findings. Code Review and QA put theirs here.</p>');
        const tokens = card("Tokens", P.tokens(v));
        const grid = '<div class="c-grid">' + needs + where + now + since +
          '<div class="c-col">' + P.prPanel(v, { foldChecks: true }) + tokens + "</div>" +
          '<div class="c-col">' + findings + P.decisions(v) + "</div>" +
          '<div class="c-col">' + P.notePanel(v) + P.connected(v) + "</div>" +
          '<div class="c-col">' + P.attachments(v) + P.brief(v) + P.details(v) + "</div></div>";
        const drawer = '<aside class="c-drawer" id="c-drawer" aria-label="Timeline"><div class="c-drawer-head"><h2>Timeline</h2><span class="t-secondary">' + esc(v.items.length + " entries, newest first") + "</span>" +
          '<button type="button" class="icon-btn" aria-label="Close the timeline" title="Close (Esc)" data-drawer-close>' + icon("close") + "</button></div>" + P.filterChips(v, ui) +
          '<div class="c-drawer-body">' + P.timeline(v, ui) + "</div></aside>";
        return '<div class="c-page">' + P.header(v, { timeline: tlButton }) + '<div class="c-wrap' + (open ? " drawer-open" : "") + '" id="c-wrap">' + grid + drawer + "</div></div>";
      }

      function setDrawer(open) {
        const st = PROTO.state();
        st.ui.drawer = open;
        document.getElementById("c-wrap").classList.toggle("drawer-open", open);
        document.querySelectorAll("[data-drawer]").forEach((b) => b.setAttribute("aria-expanded", String(open)));
      }

      PROTO.start({
        id: "c",
        name: "C · Desk",
        idea: "A desk of cards, one question each; the full timeline is a drawer, docked on a desktop.",
        render: render,
        onReveal: function () { setDrawer(true); },
        onEscape: function () { if (PROTO.state().prefs.width !== "desktop") setDrawer(false); },
        onClick: function (e) {
          if (e.target.closest("[data-drawer]")) { setDrawer(!drawerOpen(PROTO.state().ui)); return; }
          if (e.target.closest("[data-drawer-open]")) { setDrawer(true); return; }
          if (e.target.closest("[data-drawer-close]")) { setDrawer(false); return; }
          if (e.target.id === "c-wrap" && PROTO.state().prefs.width !== "desktop") setDrawer(false);
        },
      });
    })();
  </script>
</body>
</html>
