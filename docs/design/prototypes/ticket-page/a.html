<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A · Story · Ticket page prototype</title>
  <link rel="stylesheet" href="../../catalog/tokens.css">
  <link rel="stylesheet" href="../../catalog/components.css">
  <link rel="stylesheet" href="kit.css">
  <style>
    /*
     * A · Story. The ticket's life is the page: one timeline, newest first, with the run that is
     * running now at its top, unfolded and live, and the open Question above it. The facts sit in
     * a rail beside it. On a desktop the timeline gains a column of filters on its left and the
     * rail splits into two columns; the timeline keeps its measure.
     */
    .a-page { display: grid; gap: var(--space-6); }
    .a-head-path { display: grid; gap: var(--space-2); padding-top: var(--space-1); }
    .a-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--space-6); align-items: start; }
    .a-index { display: none; }
    .a-main { display: grid; gap: var(--space-5); min-width: 0; }
    .a-tl-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); }
    .a-tl-head h2 { font: var(--type-heading); }
    .a-tl-head .new { font: var(--type-secondary); color: var(--accent-text); font-weight: 550; }
    .a-tl-head .tl-filters { margin-left: auto; }
    .a-rail { display: grid; gap: var(--space-5); align-content: start; min-width: 0; }
    .a-rail-col { display: grid; gap: var(--space-5); align-content: start; min-width: 0; }

    @container page (min-width: 1600px) {
      .a-body { grid-template-columns: 200px minmax(0, 860px) minmax(0, 860px); justify-content: center; column-gap: var(--space-10); }
      .a-index { display: block; position: sticky; top: var(--space-4); }
      .a-index .tl-index { position: static; }
      .a-tl-head .tl-filters { display: none; }
      .a-rail { grid-template-columns: 1fr 1fr; column-gap: var(--space-6); }
    }
  </style>
</head>
<body>
  <script src="../../catalog/stories.js"></script>
  <script src="fixtures.js"></script>
  <script src="kit.js"></script>
  <script>
    (function () {
      "use strict";
      const P = PROTO.parts;

      function render(v, ui) {
        const statusExtra = '<div class="a-head-path" style="flex-basis:100%">' + P.phasePath(v, { compact: true }) + "</div>";
        const newCount = v.unseenCount ? v.unseenCount + " new since you last looked, at " + PROTO.hm(v.lastSeen) : "Nothing new since you last looked";
        const railA = P.whereItStands(v, { compact: false, noSum: true }) + P.prPanel(v, { foldChecks: true }) + P.notePanel(v);
        const railB = P.decisions(v) + P.attachments(v) + P.connected(v) + P.brief(v) + P.details(v);
        return '<div class="a-page">' + P.header(v, { statusExtra: statusExtra }) +
          '<div class="a-body">' +
            '<aside class="a-index" aria-label="Filters">' + P.filterIndex(v, ui) + "</aside>" +
            '<main class="a-main">' + (v.openQuestion ? P.question(v) : P.nothingNeedsYou(v)) +
              '<div class="a-tl-head"><h2>Timeline</h2><span class="new">' + PROTO.esc(newCount) + "</span>" + P.filterChips(v, ui) + "</div>" +
              P.timeline(v, ui) +
            "</main>" +
            '<aside class="a-rail" aria-label="Facts"><div class="a-rail-col">' + railA + '</div><div class="a-rail-col">' + railB + "</div></aside>" +
          "</div></div>";
      }

      PROTO.start({
        id: "a",
        name: "A · Story",
        idea: "The timeline is the page; the run now is its newest entry, live. Facts in a rail beside it.",
        render: render,
      });
    })();
  </script>
</body>
</html>
